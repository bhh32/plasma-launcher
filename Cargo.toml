[workspace]
resolver = "3"
members = ["pl-app", "pl-config", "pl-ipc", "pl-plugins", "pl-service"]

[workspace.package]
version = "0.1.0"
authors = ["Bryan Hyland <bryan.hyland32@gmail.com>"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
pl-config = { path = "./pl-config" }
pl-ipc = { path = "./pl-ipc" }
pl-plugins = { path = "./pl-plugins" }
pl-service = { path = "./pl-service" }

color-eyre = "0.6"
freedesktop-desktop-entry = "0.8"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
